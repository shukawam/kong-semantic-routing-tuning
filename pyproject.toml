[project]
name = "semtune"
version = "0.1.0"
description = "Kong AI Gateway semantic routing tuning toolkit"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2",
    "httpx>=0.28",
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "langfuse>=2.55",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jupyterlab>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semtune"]
